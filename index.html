<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsTimer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-layout">
      
      <aside class="left-sidebar">
        <div class="event-box">
          <label for="events">Choose an event: </label>
          <select name="events" id="events">
            <option value="2x2">2x2</option>
            <option value="3x3">3x3</option>
            <option value="4x4">4x4</option>
            <option value="pyraminx">Pyraminx</option>
          </select>
        </div>

        <div class="table">
          <table>
            <thead>
              <tr>
                <th>solve</th>
                <th>time</th>
                <th>Avg (5/12)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th>solve1</th>
                <th id="time1">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve2</th>
                <th id="time2">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve3</th>
                <th id="time3">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve4</th>
                <th id="time4">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve5</th>
                <th id="time5">-</th>
                <th id="ao5th">-</th>
              </tr>
              <tr>
                <th>solve6</th>
                <th id="time6">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve7</th>
                <th id="time7">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve8</th>
                <th id="time8">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve9</th>
                <th id="time9">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve10</th>
                <th id="time10">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve11</th>
                <th id="time11">-</th>
                <th>-</th>
              </tr>
              <tr>
                <th>solve12</th>
                <th id="time12">-</th>
                <th id="ao12th">-</th>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="about">
          <button id="aboutbutton" onclick="about()">About jsTimer</button>
          <p id="abouttext"></p>
        </div>
      </aside>

      <main class="main-stage">
        <header class="scramble-bar">
          <div class="resetalgsparagraph">
            <p id="algs">R U R' U' F2 D L2 ...</p>
          </div>
          <div class="resetalgs">
            <button id="resetalgs" onclick="refreshAlgs()">Give Me Another Scramble</button>
          </div>
        </header>

        <section class="timer-center">
          <div class="timer">
            <p id="timertext">0.00</p>
          </div>

          <div class="stats-row">
            <div class="ao5">
              <p id="ao5text">ao5: -.--</p>
            </div>
            <div class="ao12">
              <p id="ao12text">ao12: -.--</p>
            </div>
          </div>
        </section>
      </main>

    </div>

    <script src="main.js"></script>
  </body>
</html>
